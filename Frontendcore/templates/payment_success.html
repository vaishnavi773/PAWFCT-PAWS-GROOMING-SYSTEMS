{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Success</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      color: #333;
    }
    .success-container {
      max-width: 600px;
      margin: 80px auto;
      padding: 40px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
    }
    .success-icon {
      font-size: 70px;
      color: #28a745;
    }
    .btn-home {
      margin-top: 20px;
      display: inline-block;
      padding: 12px 25px;
      background: #28a745;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.3s;
    }
    .btn-home:hover {
      background: #218838;
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="success-icon">✅</div>
    <h1>Payment Successful!</h1>
    <p>Thank you for booking with <strong>PetLover</strong>.  
    We’ve received your payment successfully.</p>
    <a href="{% url 'indexpage' %}" class="btn-home">Back to Home</a>
  </div>
</body>
</html>
