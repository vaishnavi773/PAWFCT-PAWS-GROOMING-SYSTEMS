<div class="checkout-container">
    <h2>Checkout - {{ plan }} Plan</h2>
    <p>Amount: ₹{{ amount|floatformat:2 }}</p>

    <button id="rzp-button1" class="btn btn-pay">Pay with Razorpay</button>
    <a href="{% url 'payment_failed' %}"><button type="button" class="btn btn-cancel">Cancel</button></a>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.getElementById('rzp-button1').onclick = function(e) {
    e.preventDefault();

    var options = {
        "key": "{{ razorpay_key }}",
        "amount": "{{ amount }}",
        "currency": "INR",
        "name": "Pet Grooming",
        "description": "{{ plan }} Plan Payment",
        "order_id": "{{ order_id }}",
        "theme": { "color": "#F37254" },
        "handler": function(response){
            // Minimal data sent to payment_success
            fetch("{% url 'payment_success' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    "service_id": "{{ service_id }}",
                    "razorpay_payment_id": response.razorpay_payment_id,
                    "razorpay_order_id": response.razorpay_order_id,
                    "razorpay_signature": response.razorpay_signature
                })
            }).then(res => res.text())
              .then(html => {
                  document.open();
                  document.write(html);
                  document.close();
              });
        }
    };

    var rzp1 = new Razorpay(options);
    rzp1.open();
};
</script>
